name: Build Hardened JRE 21 Jammy Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile.jre21-jammy
      - .github/workflows/build-jre21-jammy-hardened.yml

permissions:
  contents: read

env:
  IMAGE_NAME: sujikin/backend
  IMAGE_TAG: jre21-jammy
  IMAGE_HARDENED_TAG: jre21-jammy-hardened
  IMAGE_VERSION_TAG: jre21-jammy-ubuntu22.04-java21-hardened
  TEMURIN_IMAGE: eclipse-temurin:21-jre-jammy
  TEMURIN_DIGEST: sha256:d55dbd057686905745ddc5db95043c54a085cc07b7012dc7941a5c900979c6d7

jobs:
  build-scan-push:
    name: Build, scan, and push hardened Jammy image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build hardened image for scanning
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile.jre21-jammy
          pull: true
          no-cache: true
          load: true
          build-args: |
            TEMURIN_IMAGE=${{ env.TEMURIN_IMAGE }}
            TEMURIN_DIGEST=${{ env.TEMURIN_DIGEST }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_HARDENED_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION_TAG }}

      - name: Smoke test Java runtime
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Scan hardened image with patched Trivy action
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          timeout: 30m

      - name: Push hardened image to Docker Hub
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_HARDENED_TAG }}
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION_TAG }}